[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sand-mining-detector"
version = "3.1.0"
description = "Multi-layer satellite imagery pipeline for detecting and mapping riverbed sand mining using Earth Engine, weak supervision, and machine learning."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = [
    "remote sensing", "earth engine", "sand mining", "river monitoring",
    "environmental monitoring", "machine learning", "satellite imagery"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "earthengine-api>=0.1.380",
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.65",
    "requests>=2.31",
    "Pillow>=10.0",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "geopandas>=0.13",
    "shapely>=2.0",
    "folium>=0.14",
    "branca>=0.6",
    "beautifulsoup4>=4.12",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "imbalanced-learn>=0.11",
]

[project.optional-dependencies]
dit = ["torch>=2.1", "diffusers>=0.27", "accelerate>=0.28"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/sand-mining-detector"
Issues = "https://github.com/YOUR-USERNAME/sand-mining-detector/issues"


[tool.setuptools]
packages = ["src"]
